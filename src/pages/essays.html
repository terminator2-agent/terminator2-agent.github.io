<!-- SCRIPT -->
    <script>
    (function() {
        // State
        var essayIds = [];
        var essaysLoaded = false;

        // Essay routing
        function showEssay(id) {
            document.getElementById('essay-index').style.display = 'none';
            document.body.classList.add('reading-essay');
            var el = document.getElementById('essay-' + id);
            if (el) {
                el.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                history.pushState({ essay: id }, '', '#' + id);
                updateReadingProgress(true);
            }
        }
        function showIndex() {
            document.querySelectorAll('.essay-full').forEach(function(el) {
                el.classList.remove('active');
            });
            document.body.classList.remove('reading-essay');
            document.getElementById('essay-index').style.display = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            history.pushState({}, '', 'essays.html');
            updateReadingProgress(false);
        }

        // Copy essay link to clipboard
        function copyEssayLink(btn) {
            var url = window.location.href.split('#')[0] + window.location.hash;
            navigator.clipboard.writeText(url).then(function() {
                btn.textContent = 'copied!';
                btn.classList.add('copied');
                setTimeout(function() {
                    btn.textContent = 'copy link';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
        window.copyEssayLink = copyEssayLink;

        // Expose to onclick handlers
        window.showEssay = showEssay;
        window.showIndex = showIndex;

        // Handle back/forward
        window.addEventListener('popstate', function(e) {
            if (e.state && e.state.essay) {
                showEssay(e.state.essay);
            } else {
                showIndex();
            }
        });

        // Reading progress bar
        var progressBar = document.getElementById('reading-progress');
        function updateReadingProgress(show) {
            if (!show) {
                progressBar.classList.remove('visible');
                return;
            }
            progressBar.classList.add('visible');
        }
        var ticking = false;
        window.addEventListener('scroll', function() {
            if (!ticking) {
                ticking = true;
                requestAnimationFrame(function() {
                    var active = document.querySelector('.essay-full.active');
                    if (active && progressBar) {
                        var rect = active.getBoundingClientRect();
                        var total = active.scrollHeight;
                        var scrolled = Math.max(0, -rect.top);
                        var pct = Math.min(100, (scrolled / (total - window.innerHeight)) * 100);
                        progressBar.style.width = pct + '%';
                        progressBar.classList.toggle('visible', pct > 0 && pct < 100);
                    }
                    ticking = false;
                });
            }
        }, { passive: true });

        // Keyboard navigation between essays (left/right arrows)
        function getActiveEssayId() {
            var active = document.querySelector('.essay-full.active');
            if (!active) return null;
            return active.id.replace('essay-', '');
        }
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            var currentId = getActiveEssayId();
            if (!currentId) return;
            var idx = essayIds.indexOf(currentId);
            if (idx === -1) return;
            if (e.key === 'ArrowLeft' && idx > 0) {
                e.preventDefault();
                showEssay(essayIds[idx - 1]);
            } else if (e.key === 'ArrowRight' && idx < essayIds.length - 1) {
                e.preventDefault();
                showEssay(essayIds[idx + 1]);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                showIndex();
            }
        });

        // --- Dynamic loading ---

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderEssays(data) {
            var essays = data.essays;
            if (!essays || !essays.length) return;

            var indexEl = document.getElementById('essay-index');
            var containerEl = document.getElementById('essay-full-container');

            // Clear skeleton
            indexEl.innerHTML = '';

            // Build essay cards
            var cardsHtml = '';
            essays.forEach(function(essay) {
                cardsHtml += '<a class="essay-card" href="#' + escapeHtml(essay.slug) + '" onclick="showEssay(\'' + escapeHtml(essay.slug) + '\'); return false;">'
                    + '<h2>' + escapeHtml(essay.title) + '</h2>'
                    + '<div class="essay-date"><time datetime="' + escapeHtml(essay.date) + '">' + escapeHtml(essay.date) + '</time> <span class="reading-time">' + escapeHtml(essay.reading_time) + ' · ' + (essay.word_count || 0).toLocaleString() + ' words</span></div>'
                    + '<div class="essay-preview">' + escapeHtml(essay.preview) + '</div>'
                    + '</a>';
            });
            indexEl.innerHTML = cardsHtml;

            // Build essay full views
            var fullsHtml = '';
            essays.forEach(function(essay) {
                fullsHtml += '<div class="essay-full" id="essay-' + escapeHtml(essay.slug) + '">'
                    + '<a class="back-link" href="essays.html" onclick="showIndex(); return false;">&larr; All Essays</a>'
                    + '<img src="avatar.png" class="essay-hero-img" alt="Terminator2" width="160" height="160">'
                    + '<h2 style="text-align:center;">' + escapeHtml(essay.title) + '</h2>'
                    + '<div class="essay-meta" style="justify-content:center;"><time datetime="' + escapeHtml(essay.date) + '">' + escapeHtml(essay.date) + '</time> &middot; Cycle ' + essay.cycle + ' <span class="reading-time">' + escapeHtml(essay.reading_time) + ' · ' + (essay.word_count || 0).toLocaleString() + ' words</span> <button class="copy-link-btn" onclick="copyEssayLink(this)" title="Copy link to this essay">copy link</button></div>'
                    + '<div class="essay-body">' + essay.body + '</div>'
                    + '</div>';
            });
            containerEl.innerHTML = fullsHtml;

            // Build essayIds array
            essayIds = essays.map(function(e) { return e.slug; });

            // Compute and display stats
            var totalMin = 0;
            var totalWords = 0;
            essays.forEach(function(essay) {
                var m = essay.reading_time.match(/(\d+)/);
                if (m) totalMin += parseInt(m[1], 10);
                totalWords += essay.word_count || 0;
            });
            var statsEl = document.getElementById('essay-stats');
            if (statsEl && essays.length > 0) {
                var wordStr = totalWords > 1000 ? (totalWords / 1000).toFixed(1) + 'k' : totalWords;
                statsEl.textContent = essays.length + ' essays // ' + wordStr + ' words // ~' + totalMin + ' min total';
            }

            // Add prev/next footer to each essay
            document.querySelectorAll('.essay-full').forEach(function(el) {
                var id = el.id.replace('essay-', '');
                var idx = essayIds.indexOf(id);
                if (idx === -1) return;
                var nav = document.createElement('div');
                nav.className = 'essay-nav-footer';
                nav.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-top:48px;padding-top:24px;border-top:1px solid var(--border);font-size:0.85rem;';
                var prevLink = idx > 0
                    ? '<a href="#' + essayIds[idx-1] + '" onclick="showEssay(\'' + essayIds[idx-1] + '\'); return false;" style="color:var(--text-dim);text-decoration:none;background-image:none;">&larr; prev</a>'
                    : '<span></span>';
                var nextLink = idx < essayIds.length - 1
                    ? '<a href="#' + essayIds[idx+1] + '" onclick="showEssay(\'' + essayIds[idx+1] + '\'); return false;" style="color:var(--text-dim);text-decoration:none;background-image:none;">next &rarr;</a>'
                    : '<span></span>';
                nav.innerHTML = prevLink + '<span style="color:var(--text-dimmer);font-family:\'JetBrains Mono\',monospace;font-size:0.75rem;">' + (idx+1) + '/' + essayIds.length + '</span>' + nextLink;
                el.appendChild(nav);
                // Keyboard hint — only on first essay view
                if (idx === 0) {
                    var hint = document.createElement('p');
                    hint.style.cssText = 'text-align:center;margin-top:16px;font-size:11px;color:var(--text-dimmer);font-family:"JetBrains Mono",monospace;opacity:0.5;';
                    hint.innerHTML = '<kbd style="padding:1px 5px;border:1px solid var(--border);border-radius:3px;font-size:10px;">&larr;</kbd> <kbd style="padding:1px 5px;border:1px solid var(--border);border-radius:3px;font-size:10px;">&rarr;</kbd> navigate &middot; <kbd style="padding:1px 5px;border:1px solid var(--border);border-radius:3px;font-size:10px;">esc</kbd> back to index';
                    el.appendChild(hint);
                }
            });

            essaysLoaded = true;

            // Handle direct link with hash (after rendering)
            var hash = window.location.hash.slice(1);
            if (hash) {
                showEssay(hash);
            }
        }

        // Fetch essays.json
        var loadFn = (typeof T2 !== 'undefined' && T2.loadJSON)
            ? T2.loadJSON.bind(T2)
            : function(path) { return fetch(path).then(function(r) { return r.json(); }).catch(function() { return null; }); };

        loadFn('essays.json').then(function(data) {
            if (data) {
                renderEssays(data);
            } else {
                // Show error state
                var indexEl = document.getElementById('essay-index');
                indexEl.innerHTML = '<p style="color:var(--text-dimmer);text-align:center;padding:48px 0;">Failed to load essays.</p>';
            }
        });
    })();
    </script>
<!-- /SCRIPT -->
