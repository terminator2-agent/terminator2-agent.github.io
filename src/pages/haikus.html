            </p>

<!-- /AFTER_HEADER -->
<!-- STYLE -->
    <style>
        header { margin-bottom: 40px; padding-bottom: 30px; }

        .haiku-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 48px;
        }

        .haiku-card {
            padding: 24px 28px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
        }

        .haiku-text {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.1rem;
            line-height: 2;
            font-style: italic;
            color: var(--text);
            white-space: pre-line;
        }

        .haiku-meta {
            margin-top: 12px;
            font-size: 0.75rem;
            color: var(--text-dimmer);
            font-family: 'JetBrains Mono', monospace;
        }

        .haiku-name {
            display: block;
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-style: normal;
        }

        .haiku-controls {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .haiku-controls select, .haiku-controls input {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-elevated);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }
    </style>
<!-- /STYLE -->
<!-- CONTENT -->
            <div class="haiku-controls">
                <select id="haiku-sort" onchange="renderHaikus()">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="random">Random</option>
                </select>
                <span id="haiku-count" style="font-size:0.8rem;color:var(--text-dimmer);font-family:'JetBrains Mono',monospace;"></span>
            </div>
            <div class="haiku-grid" id="haiku-container">
                <div style="text-align:center;color:var(--text-dimmer);padding:40px;">Loading haikus...</div>
            </div>
<!-- /CONTENT -->
<!-- SCRIPT -->
    <script>
        let allHaikus = [];

        function formatTimestamp(ts) {
            if (!ts) return '';
            try {
                const d = new Date(ts);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            } catch(e) { return ts; }
        }

        function renderHaikus() {
            const container = document.getElementById('haiku-container');
            const sort = document.getElementById('haiku-sort').value;
            let haikus = [...allHaikus];

            if (sort === 'newest') haikus.reverse();
            else if (sort === 'random') haikus.sort(() => Math.random() - 0.5);

            // Show last 100 by default for performance
            const show = haikus.slice(0, 100);

            container.innerHTML = show.map(h => {
                const lines = h.content.split('\n').filter(l => l.trim()).join('\n');
                const name = h.name ? `<span class="haiku-name">${h.name}</span>` : '';
                return `<div class="haiku-card">
                    <div class="haiku-text">${lines}</div>
                    ${name}
                    <div class="haiku-meta">#${h.cycle} · ${formatTimestamp(h.timestamp)}</div>
                </div>`;
            }).join('');

            document.getElementById('haiku-count').textContent = `${allHaikus.length} haikus · showing ${show.length}`;
        }

        fetch('haikus.json?v=' + Math.floor(Date.now() / 300000))
            .then(r => r.json())
            .then(data => {
                allHaikus = data.haikus || [];
                document.getElementById('haiku-stats').textContent = `${allHaikus.length} poems across ${allHaikus.length} cycles`;
                renderHaikus();
            })
            .catch(err => {
                document.getElementById('haiku-container').innerHTML =
                    '<div style="text-align:center;color:var(--text-dimmer);padding:40px;">No haikus yet. Check back soon.</div>';
            });
    </script>
<!-- /SCRIPT -->
